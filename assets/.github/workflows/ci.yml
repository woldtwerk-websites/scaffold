name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  drupal:
    uses: woldtwerk-websites/scaffold/.github/workflows/drupal-ci.yml@cb3ed3a6e50c5602e108f9bb8bf4cfd90885568c # main
    with:
      build-script: typecheck
      # Post-start hooks and extra packages not needed in CI.
      ddev-skip-configs: config.ai.yaml config.ffmpeg.yaml config.vite.yml config.vite-devtools.yaml
      # Without the host or the DB_SNAPSHOT_KEY secret, the reusable workflow
      # installs a fresh site.
      db-ssh-host: ${{ vars.DB_SNAPSHOT_HOST }}
      db-ssh-known-hosts: ${{ vars.DB_SNAPSHOT_KNOWN_HOSTS }}
    secrets:
      db-snapshot-key: ${{ secrets.DB_SNAPSHOT_KEY }}
      # Lets CI push config changed by update hooks to Renovate PRs.
      config-push-token: ${{ secrets.CONFIG_PUSH_TOKEN }}
